name: ragflow-lite-local

services:
  infinity:
    image: infiniflow/infinity:v0.7.0-dev5
    volumes:
      - /tmp/ragflow-lite-infinity-data:/var/infinity
    ports:
      - "127.0.0.1:23817:23817"
      - "127.0.0.1:23820:23820"

  app:
    profiles:
      - observability
    build:
      context: ..
      dockerfile: docker/app/Dockerfile.dev
    working_dir: /workspace
    command:
      - sh
      - -lc
      - |
        set -a
        . data/agent-runtime/local.env
        set +a
        exec uvicorn ragflow_lite.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONPATH: /workspace/src
      RAGFLOW_LITE_LOG_LEVEL: INFO
      RAGFLOW_LITE_LOG_FORMAT: json
      RAGFLOW_LITE_METRICS_ENABLED: "true"
      RAGFLOW_LITE_INFINITY_HOST: infinity
      RAGFLOW_LITE_INFINITY_PORT: "23817"
    volumes:
      - ..:/workspace
    ports:
      - "8000:8000"
    depends_on:
      - infinity

  prometheus:
    profiles:
      - observability
    image: prom/prometheus:v3.11.1
    pull_policy: never
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  loki:
    profiles:
      - observability
    image: grafana/loki:3.6.3
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    profiles:
      - observability
    image: grafana/alloy:latest
    pull_policy: never
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
      - app

  grafana:
    profiles:
      - observability
    image: grafana/grafana:latest
    pull_policy: never
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  grafana-data:
  loki-data:
