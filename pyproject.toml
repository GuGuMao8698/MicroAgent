[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragflow-lite"
version = "0.1.0"
description = "Minimal txt/md/pdf RAG pipeline for MicroRAG."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1,<1.0.0",
    "infinity-sdk==0.7.0.dev5",
    "markdown-it-py>=4.0.0,<5.0.0",
    "openai>=2.0.0,<3.0.0",
    "prometheus-client>=0.22.1,<1.0.0",
    "pypdf>=6.8.0,<7.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "sqlglot[c]>=30.1.0,<31.0.0",
    "volcengine-python-sdk[ark]>=5.0.21,<6.0.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.38,<1.39",
    "deepeval>=3.7.0,<4.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.15,<0.16",
]

[project.scripts]
mcrag = "ragflow_lite.cli.mcrag:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragflow_lite = [
    "static/*.css",
    "static/*.js",
    "agent_runtime/CLAUDE.md",
    "agent_runtime/settings.json",
    "agent_runtime/skills/microrag-search/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.basedpyright]
pythonVersion = "3.13"
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
